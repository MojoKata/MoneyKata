[project]
name = "moolakata-connector"
version = "0.2.0-dev"
description = "Keeps MoolaKata's accounts current from their institutions, holding the credentials where MoolaKata can't"
license = "GPL-3.0-only"
requires-python = "==3.14.*"
# The core's one dependency (requirements S18.1.2): its keys and the vault need Ed25519,
# X25519 and AES-GCM, which the standard library doesn't provide. Pinned with hashes in
# requirements.txt for the image.
dependencies = ["cryptography==50.0.2"]

[project.scripts]
moolakata-connector = "moolakata_connector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moolakata_connector"]
