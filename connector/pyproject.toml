[project]
name = "moneykata-connector"
version = "0.1.0"
description = "Keeps MoneyKata's accounts current from their institutions, holding the credentials where MoneyKata can't"
license = "GPL-3.0-only"
requires-python = "==3.14.*"
# The core's one dependency (requirements S18.1.2): its keys and the vault need Ed25519,
# X25519 and AES-GCM, which the standard library doesn't provide. Pinned with hashes in
# requirements.txt for the image.
dependencies = ["cryptography==50.0.2"]

[project.scripts]
moneykata-connector = "moneykata_connector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moneykata_connector"]
