{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.connector_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{# The image's own account, which the sealed vault belongs to. #}
{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{# Compose copies a chosen certificate into the container, which a read-only root can't
   take; the image's files are root's either way, and the connector runs as its own account. #}
{% do c1.set_read_only(not values.network.certificate_id) %}
{% do c1.set_grace_period(10) %}
{# Alive, locked or not: a locked connector is waiting for its words, not failing. #}
{% do c1.healthcheck.set_custom_test(["CMD", "moolakata-connector", "status"]) %}
{% do c1.healthcheck.set_interval(60) %}
{% do c1.healthcheck.set_start_period(20) %}

{% do c1.environment.add_env("MOOLAKATA_CONNECTOR_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("MOOLAKATA_CONNECTOR_NAMES", values.moolakata_connector.names | join(",")) %}
{% if values.network.certificate_id %}
  {% do c1.environment.add_env("MOOLAKATA_CONNECTOR_TLS_CERT", values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("MOOLAKATA_CONNECTOR_TLS_KEY", values.consts.ssl_key_path) %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
{% endif %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs"}) %}
{% do c1.add_storage("/run/moolakata-connector", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "0700"}}) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("The first visit to the connector's page shows its 12 words once and takes three of them back. Keep them offline: they are the only key to the credentials it holds.") %}
{% do tpl.notes.add_info("After every restart, an update or a reboot, the connector starts locked until someone enters the 12 words on its page.") %}
{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}

{{ tpl.render() | tojson }}
