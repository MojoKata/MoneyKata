resources:
  limits:
    cpus: 1.0
    memory: 1024

TZ: America/Chicago

moolakata_connector:
  names:
    - 192.168.1.20
    - moolakata.local

network:
  host_network: false
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 30374

ix_volumes:
  data: /opt/tests/mnt/moolakata-connector/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
