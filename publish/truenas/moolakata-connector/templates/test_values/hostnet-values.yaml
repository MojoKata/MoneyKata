resources:
  limits:
    cpus: 1.0
    memory: 1024

TZ: America/Chicago

moolakata_connector:
  names:
    - 192.168.1.20
    - moolakata.local

network:
  host_network: true
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 30374

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/moolakata-connector/data
      create_host_path: true
      auto_permissions: true
