images:
  image:
    repository: ghcr.io/mojokata/moolakata-connector
    tag: "0.1.0"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  connector_container_name: connector
  perms_container_name: permissions
  run_as_user: 10002
  run_as_group: 10002
  data_path: /var/lib/moolakata-connector
  ssl_cert_path: /etc/moolakata-connector/tls/fullchain.pem
  ssl_key_path: /etc/moolakata-connector/tls/privkey.pem
