{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.moolakata_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{# The image's own account, which the keyring and the database belong to. #}
{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{# Compose copies a chosen certificate into the container, which a read-only root can't
   take; the image's files are root's either way, and the server runs as its own account. #}
{% do c1.set_read_only(not values.network.certificate_id) %}
{% do c1.set_grace_period(10) %}
{# Alive, locked or not: a locked server is waiting for its phrase, not failing. #}
{% do c1.healthcheck.set_custom_test(["CMD", "moolakata", "health"]) %}
{% do c1.healthcheck.set_start_period(60) %}

{# MoolaKata's own HTTPS, its configuration in MOOLAKATA_CONFIG rather than a file. #}
{% set config -%}
[server]
name = "moolakata"
mode = "tls"
port = {{ values.network.web_port.port_number }}

[paths]
data = "{{ values.consts.data_path }}"
backups = "{{ values.consts.backups_path }}"

[tls]
{% if values.network.certificate_id -%}
cert = "{{ values.consts.ssl_cert_path }}"
key = "{{ values.consts.ssl_key_path }}"
{% endif -%}
names = {{ values.moolakata.names | tojson }}
{%- endset %}
{% do c1.environment.add_env("MOOLAKATA_CONFIG", config) %}
{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
{% endif %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage(values.consts.backups_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}
{# Uploads and the reader's scratch stay in memory; the socket for host commands is the
   server's account's alone. #}
{% do c1.add_storage("/tmp", {"type": "tmpfs"}) %}
{% do c1.add_storage("/run/moolakata", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "0700"}}) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("The first visit to the web page welcomes the first admin: it shows the recovery phrase once, takes three of its words back, and sets up the admin account. Keep the phrase offline: it is the only key to the data.") %}
{% do tpl.notes.add_info("After every restart, an update or a reboot, MoolaKata starts locked until someone enters the phrase on its page.") %}
{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}

{{ tpl.render() | tojson }}
