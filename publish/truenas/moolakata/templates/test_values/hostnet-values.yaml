resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: America/Chicago

moolakata:
  names:
    - 192.168.1.20
    - moolakata.local

network:
  host_network: true
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 30373

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/moolakata/data
      create_host_path: true
      auto_permissions: true
  backups:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/moolakata/backups
      create_host_path: true
      auto_permissions: true
