resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: America/Chicago

moolakata:
  names:
    - 192.168.1.20
    - moolakata.local

network:
  host_network: false
  certificate_id: "1"
  web_port:
    bind_mode: published
    port_number: 30373

ix_volumes:
  data: /opt/tests/mnt/moolakata/data
  backups: /opt/tests/mnt/moolakata/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true

