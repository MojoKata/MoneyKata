# web/check on every pull request and every push to main (requirements S17.10), on GitHub's
# standard runners, free for a public repository. The actions are pinned by commit and listed
# in the register (docs/dependencies.md); everything else is the repository's own scripts.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uv, pinned with its hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet --require-hashes -r web/install/build-requirements.txt
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: web/dev.sh setup (Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check
        run: |
          set -o pipefail
          web/check 2>&1 | tee "$RUNNER_TEMP/check.log"
      # What failed, as annotations: they show on the pull request and through the API, where
      # a reader without access to the run's log can see them.
      - name: say what failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/check.log"
          grep -E '^FAILED: ' "$log" | sed 's/^/::error title=web\/check::/' || true
          grep -E '^(FAILED|ERROR) tests/' "$log" | head -n 8 | sed 's/^/::error title=pytest::/' || true
          tail -n 40 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g;s/^/::error title=the end of the log::/'
