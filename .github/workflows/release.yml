# Releases (requirements S17.8.1, S17.8.2, S17.10). On a v<version> tag: both images for amd64
# and arm64, each built and smoke-run natively on a runner of its architecture, pushed to
# ghcr.io under the repository's owner, joined into one tag per image, and attested (build
# provenance, Sigstore). On a pull request that touches what goes into the images: the same
# builds and smoke runs, and nothing is pushed.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - web/install/**
      - web/server/uv.lock
      - connector/Dockerfile
      - connector/requirements.txt

permissions:
  contents: read

jobs:
  build:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag names this version
        if: github.event_name == 'push'
        run: test "v$(cat web/VERSION)" = "$GITHUB_REF_NAME"
      - name: smoke run, the release gate (S17.8.1)
        run: web/install/smoke.sh
      - name: push the smoke-tested images, tagged by architecture
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat web/VERSION)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in moneykata moneykata-connector; do
            docker tag "$image:$version-smoke" "ghcr.io/$owner/$image:$version-${{ matrix.arch }}"
            docker push --quiet "ghcr.io/$owner/$image:$version-${{ matrix.arch }}"
          done

  publish:
    name: one tag per image, attested
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: join the architectures under the version's tag
        id: join
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          for image in moneykata moneykata-connector; do
            ref="ghcr.io/$owner/$image"
            docker buildx imagetools create -t "$ref:$version" "$ref:$version-amd64" "$ref:$version-arm64"
            digest="$(docker buildx imagetools inspect "$ref:$version" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${image//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: attest the server's image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.join.outputs.registry }}/moneykata
          subject-digest: ${{ steps.join.outputs.moneykata }}
          push-to-registry: true
      - name: attest the connector's image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.join.outputs.registry }}/moneykata-connector
          subject-digest: ${{ steps.join.outputs.moneykata_connector }}
          push-to-registry: true
