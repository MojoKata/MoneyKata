# nginx in front of MoolaKata in proxy mode; list nginx's address in trusted_proxies.
server {
    listen 443 ssl;
    http2 on;
    server_name money.example.lan;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    client_max_body_size 30m;   # uploads up to Settings' limit (25 MB by default)

    location / {
        proxy_pass http://moolakata:37373;
        proxy_set_header Host $http_host;   # with its port: it must match the page's Origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # the live stream must not be buffered
        proxy_read_timeout 1h;
    }
}
