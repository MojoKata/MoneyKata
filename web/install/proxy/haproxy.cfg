# haproxy in front of MoneyKata in proxy mode; list haproxy's address in trusted_proxies.
frontend https
    bind :443 ssl crt /etc/haproxy/tls/money.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    option forwardfor
    default_backend moneykata

backend moneykata
    timeout server 1h   # the live stream stays open for minutes
    server mk moneykata:37373 check
