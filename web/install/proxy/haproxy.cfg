# haproxy in front of MoneyKata in proxy mode; list haproxy's address in trusted_proxies.
defaults
    mode http           # without it haproxy passes bytes through, and sets no headers
    timeout connect 5s
    timeout client 1h   # the live stream stays open for minutes
    timeout server 1h

frontend https
    bind :443 ssl crt /etc/haproxy/tls/money.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    option forwardfor
    default_backend moneykata

backend moneykata
    server mk moneykata:37373 check
