# MoneyKata's configuration (requirements S13.3, S15.4). Mounted read only at
# /etc/moneykata.toml. It never holds a secret: those are in the database, encrypted (S14.4), and the master key
# is a recovery phrase entered when the server starts, never a file.

[server]
# Shown in logs and the self-signed certificate. The name linked servers see is set in
# Settings › General.
name = "moneykata"
# "proxy": plain HTTP behind the household's reverse proxy, which ends TLS (the expected
# setup). "tls": MoneyKata's own HTTPS with HTTP/2, for testing on a local network.
mode = "proxy"
port = 37373
# The reverse proxy's addresses: X-Forwarded-For and -Proto are believed only from these.
trusted_proxies = ["172.16.0.0/12"]

[paths]
data = "/var/lib/moneykata"
backups = "/var/backups/moneykata"

# [tls]   in "tls" mode: a certificate and key; without them, a self-signed pair is made on
# cert = "/etc/moneykata/tls/fullchain.pem"   first start and kept in the data directory.
# key = "/etc/moneykata/tls/privkey.pem"
# names = ["money.lan", "192.168.1.20"]   what browsers use to reach it, for the self-signed
#                                         certificate (it always names the server and localhost)
