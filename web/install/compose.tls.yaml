# MoneyKata with its own HTTPS listener and a self-signed certificate, for testing on a local
# network (requirements S13.3, S17.8.4). Use compose.yaml behind a reverse proxy for real use.
# Copy moneykata.toml to moneykata-tls.toml, set mode = "tls" in it, and list under [tls] names
# the name or address browsers will use, for the self-signed certificate.

services:
  moneykata:
    image: ghcr.io/mojokata/moneykata:0.1.0
    restart: unless-stopped   # back after every reboot, locked (S13.6)
    ports:
      - "37373:37373"
    volumes:
      - ./data:/var/lib/moneykata
      - ./backups:/var/backups/moneykata
      - ./moneykata-tls.toml:/etc/moneykata.toml:ro
      - /etc/localtime:/etc/localtime:ro   # the host's time zone, which backups and emails follow
    environment:
      TZ: ${TZ:-}   # or name it here, or in .env beside this file: TZ=America/Denver (S14.9.2)
    read_only: true
    tmpfs:
      - /tmp
      - /run/moneykata:uid=10001,gid=10001,mode=0700   # where host commands reach it (S13.6)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:                # Docker keeps the logs; these bound them (operations.md)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The MoneyKata Connector (S18.10, S18.11): a second service with a volume of its own, which
  # MoneyKata never mounts. It calls out, and publishes one port: its own page, where its vault
  # is made, its words given after every start and its pairing done (operations.md §8).
  connector:
    image: ghcr.io/mojokata/moneykata-connector:0.1.0
    restart: unless-stopped
    ports:
      - "37374:37374"
    environment:
      # The addresses browsers use for its page, separated by commas: its certificate names
      # them, and MoneyKata links to the first. "192.168.1.50", say.
      MONEYKATA_CONNECTOR_NAMES: ""
    volumes:
      - connector-data:/var/lib/moneykata-connector
    read_only: true
    tmpfs:
      - /tmp
      - /run/moneykata-connector:uid=10002,gid=10002,mode=0700   # its admin socket, inside the container only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  connector-data:
