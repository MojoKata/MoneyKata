# MoneyKata behind the household's reverse proxy (requirements S17.8). Start from this file:
#   1. make the directories:   mkdir -p data backups && sudo chown 10001:10001 data backups
#   2. make the master key:    docker compose run --rm moneykata keys init
#      (it shows the recovery phrase, which is the key and is never stored: write it down, S15.6)
#   3. start:                  docker compose up -d
#   4. unlock:                 docker compose exec moneykata moneykata keys unlock
#      (or open the app: it asks for the phrase; after every restart, S15.4.3)
# Put a reverse proxy (proxy/ has Caddy, nginx and haproxy examples) in front of port 37373.

services:
  moneykata:
    image: moneykata:0.1.0
    restart: on-failure:3   # a refused start (exit 78) is not retried in a loop (S13.6)
    # Plain HTTP in proxy mode, so it is published on the host's loopback only: a proxy on
    # the host reaches 127.0.0.1:37373, and one in this compose project reaches
    # moneykata:37373 by name (proxy/) with no published port needed at all.
    ports:
      - "127.0.0.1:37373:37373"
    volumes:
      - ./data:/var/lib/moneykata
      - ./backups:/var/backups/moneykata
      - ./moneykata.toml:/etc/moneykata.toml:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run/moneykata:uid=10001,gid=10001,mode=0700   # where host commands reach it (S13.6)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:                # Docker keeps the logs; these bound them (operations.md)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # A reverse proxy in this project (proxy/ has Caddy, nginx and haproxy configurations)
  # reaches moneykata:37373 by name, from the one fixed address that trusted_proxies in
  # moneykata.toml names (S13.3):
  # proxy:
  #   image: caddy:2
  #   ports: ["443:443"]
  #   volumes: ["./proxy/Caddyfile:/etc/caddy/Caddyfile:ro"]
  #   networks:
  #     default: { ipv4_address: 172.30.37.10 }

  # The MoneyKata Connector (S18.10): a second service with a volume of its own, which
  # MoneyKata never mounts, and no published port: it only calls out. It starts locked;
  # install it once with `docker compose run --rm connector init`, and after every start
  # unlock it with `docker compose exec connector moneykata-connector unlock` (operations.md §8).
  connector:
    image: moneykata-connector:0.1.0
    restart: unless-stopped
    volumes:
      - connector-data:/var/lib/moneykata-connector
      # The Folder driver (S18.9.1): a Downloads folder, mounted read only at the watched
      # folder. A folder Connection names a folder inside it; the driver never reads outside.
      # - /home/alice/Downloads:/watch:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run/moneykata-connector:uid=10002,gid=10002,mode=0700   # its admin socket, inside the container only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  connector-data:

# A fixed range, so that the proxy's address above is known. A proxy on the host itself reaches
# 127.0.0.1:37373 from the bridge's gateway, 172.30.37.1, as every process on the host does.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.37.0/24
