# MoneyKata behind the household's reverse proxy (requirements S17.8). Start from this file:
#   1. make the directories:   mkdir -p data backups keys && sudo chown 10001:10001 data backups
#   2. make the master key:    docker compose run --rm keys-init
#      (it shows the recovery phrase: write it down, S15.6)
#   3. start:                  docker compose up -d
# Put a reverse proxy (proxy/ has Caddy, nginx and haproxy examples) in front of port 37373.

services:
  moneykata:
    image: moneykata:0.1.0
    restart: on-failure:3   # a refused start (exit 78) is not retried in a loop (S13.6)
    ports:
      - "37373:37373"
    volumes:
      - ./data:/var/lib/moneykata
      - ./backups:/var/backups/moneykata
      - ./keys:/etc/moneykata:ro          # the key directory: read only, never backed up
      - ./moneykata.toml:/etc/moneykata.toml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s

  # One-off key commands (S15.4.6): only init and rotate mount the key directory writable,
  # and only rotate mounts moneykata.toml writable (it records the previous key there). The
  # server itself keeps both read only.
  #   docker compose run --rm keys-init
  #   docker compose run --rm keys-rotate      then restart: docker compose restart moneykata
  #   docker compose run --rm moneykata keys verify
  keys-init:
    image: moneykata:0.1.0
    profiles: ["keys"]
    user: "0:0"
    command: ["keys", "init"]
    volumes:
      - ./data:/var/lib/moneykata
      - ./keys:/etc/moneykata
      - ./moneykata.toml:/etc/moneykata.toml:ro

  keys-rotate:
    image: moneykata:0.1.0
    profiles: ["keys"]
    user: "0:0"
    command: ["keys", "rotate"]
    volumes:
      - ./data:/var/lib/moneykata
      - ./keys:/etc/moneykata
      - ./moneykata.toml:/etc/moneykata.toml
